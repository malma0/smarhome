ya_ushel:
  alias: Я ушёл
  description: 'Фразы: я ушёл, я ушла, я ухожу, я пошёл, я пошла, меня не будет. Запоминает нормы и кондиционеры, гасит свет, выключает розетки и кондиционеры, держит 18 °C.'
  sequence:
  - action: scene.create
    data:
      scene_id: before_leaving
      snapshot_entities:
      - input_number.entrance_temperature_norm
      - input_number.bedroom_temperature_norm
      - input_number.office_temperature_norm
      - input_number.living_room_temperature_norm
      - input_number.corridor_temperature_norm
      - input_number.kitchen_temperature_norm
      - climate.bedroom_ac
      - climate.office_ac
      - climate.living_room_ac
      - climate.kitchen_ac
  - action: light.turn_off
    target:
      entity_id: &id003
      - light.entrance
      - light.bedroom
      - light.office
      - light.living_room
      - light.corridor
      - light.kitchen
  - action: switch.turn_off
    target:
      entity_id:
      - switch.bedroom_socket
      - switch.office_socket
      - switch.living_room_socket
      - switch.kitchen_socket
  - action: climate.set_hvac_mode
    target:
      entity_id: &id002
      - climate.bedroom_ac
      - climate.office_ac
      - climate.living_room_ac
      - climate.kitchen_ac
    data:
      hvac_mode: 'off'
  - action: input_number.set_value
    target:
      entity_id: &id001
      - input_number.entrance_temperature_norm
      - input_number.bedroom_temperature_norm
      - input_number.office_temperature_norm
      - input_number.living_room_temperature_norm
      - input_number.corridor_temperature_norm
      - input_number.kitchen_temperature_norm
    data:
      value: 18
ya_doma:
  alias: Я дома
  description: 'Фразы: я дома, я пришёл, я пришла, я вернулся, я вернулась. Возвращает нормы и кондиционеры, как было до ухода, включает свет в прихожей.'
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states.scene.before_leaving is not none }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.before_leaving
    default:
    - action: input_number.set_value
      target:
        entity_id: *id001
      data:
        value: 22
    - action: climate.set_hvac_mode
      target:
        entity_id: *id002
      data:
        hvac_mode: cool
  - action: light.turn_on
    target:
      entity_id: light.entrance
spokoynoy_nochi:
  alias: Спокойной ночи
  description: 'Фразы: спокойной ночи, я спать, ложусь спать, отбой. Гасит свет везде, в спальне норма на 2 °C ниже до утра.'
  sequence:
  - action: scene.create
    data:
      scene_id: before_night
      snapshot_entities:
      - input_number.bedroom_temperature_norm
  - action: light.turn_off
    target:
      entity_id: *id003
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_temperature_norm
    data:
      value: '{{ [states(''input_number.bedroom_temperature_norm'') | float(22) - 2, 16] | max }}'
dobroe_utro:
  alias: Доброе утро
  description: 'Фразы: доброе утро, я проснулся, я проснулась, подъём. Возвращает норму спальни, как было до ночи, включает свет в спальне на 40%.'
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states.scene.before_night is not none }}'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.before_night
    default: []
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 40
