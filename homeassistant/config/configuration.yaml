automation:
- id: entrance_temperature_norm
  alias: 'Прихожая: норма температуры'
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_number.entrance_temperature_norm
  - trigger: homeassistant
    event: start
  actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.entrance_heating
    data:
      temperature: '{{ states(''input_number.entrance_temperature_norm'') | float(22) - 0.5 }}'
- id: entrance_co2_norm
  alias: 'Прихожая: норма CO2'
  mode: restart
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
    - sensor.entrance_co2
    - input_number.entrance_co2_max
  - trigger: homeassistant
    event: start
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.entrance_co2'') | float(0) > states(''input_number.entrance_co2_max'') | float(800) }}'
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.entrance_ventilation
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.entrance_co2'') | float(0) < states(''input_number.entrance_co2_max'') | float(800) - 150 }}'
      sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.entrance_ventilation
