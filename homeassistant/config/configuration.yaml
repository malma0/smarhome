- id: virtual_house_physics
  alias: 'Виртуальный дом: физика'
  triggers:
  - trigger: time_pattern
    minutes: /1
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.entrance_temperature_sim
    data:
      value: '{{ ([[states(''input_number.entrance_temperature_sim'') | float(20.5) + (19.0 - states(''input_number.entrance_temperature_sim'') | float(20.5)) * (0.02 * (4 if false else 1)) + (0.4 if is_state(''input_boolean.entrance_heater_power'',
        ''on'') else 0) - 0, 5] | max, 40] | min) | round(1) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.entrance_co2_sim
    data:
      value: '{{ [[states(''input_number.entrance_co2_sim'') | float(450) + 15 - (90 if is_state(''input_boolean.entrance_ventilation_power'', ''on'') else 0) - (60 if false else 0), 400] | max, 5000] |
        min }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.entrance_humidity_sim
    data:
      value: '{{ ([[states(''input_number.entrance_humidity_sim'') | float(40) + (35 - states(''input_number.entrance_humidity_sim'') | float(40)) * 0.01 + 0 - (0.5 if is_state(''input_boolean.entrance_ventilation_power'',
        ''on'') else 0), 10] | max, 90] | min) | round(1) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_temperature_sim
    data:
      value: '{{ ([[states(''input_number.bedroom_temperature_sim'') | float(22.5) + (19.0 - states(''input_number.bedroom_temperature_sim'') | float(22.5)) * (0.02 * (4 if is_state(''binary_sensor.bedroom_window'',
        ''on'') else 1)) + (0.4 if is_state(''input_boolean.bedroom_heater_power'', ''on'') else 0) - (0.4 if is_state(''input_boolean.bedroom_ac_compressor'', ''on'') else 0), 5] | max, 40] | min) | round(1)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_co2_sim
    data:
      value: '{{ [[states(''input_number.bedroom_co2_sim'') | float(900) + 15 - (90 if is_state(''input_boolean.bedroom_ventilation_power'', ''on'') else 0) - (60 if is_state(''binary_sensor.bedroom_window'',
        ''on'') else 0), 400] | max, 5000] | min }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.bedroom_humidity_sim
    data:
      value: '{{ ([[states(''input_number.bedroom_humidity_sim'') | float(48) + (35 - states(''input_number.bedroom_humidity_sim'') | float(48)) * 0.01 + (1.0 if is_state(''input_boolean.bedroom_humidifier_power'',
        ''on'') else 0) - (0.5 if is_state(''input_boolean.bedroom_ventilation_power'', ''on'') else 0), 10] | max, 90] | min) | round(1) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.office_temperature_sim
    data:
      value: '{{ ([[states(''input_number.office_temperature_sim'') | float(24.0) + (19.0 - states(''input_number.office_temperature_sim'') | float(24.0)) * (0.02 * (4 if is_state(''binary_sensor.office_window'',
        ''on'') else 1)) + (0.4 if is_state(''input_boolean.office_heater_power'', ''on'') else 0) - (0.4 if is_state(''input_boolean.office_ac_compressor'', ''on'') else 0), 5] | max, 40] | min) | round(1)
        }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.office_co2_sim
    data:
      value: '{{ [[states(''input_number.office_co2_sim'') | float(1100) + 15 - (90 if is_state(''input_boolean.office_ventilation_power'', ''on'') else 0) - (60 if is_state(''binary_sensor.office_window'',
        ''on'') else 0), 400] | max, 5000] | min }}'
  - action: input_number.set_value
    target:
