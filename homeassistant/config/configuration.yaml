- id: virtual_house_physics
  alias: 'Виртуальный дом: физика'
  triggers:
  - trigger: time_pattern
    minutes: /1
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.entrance_temperature_sim
    data:
      value: '{{ ([[states(''input_number.entrance_temperature_sim'') | float(20.5) + (19.0 - states(''input_number.entrance_temperature_sim'') | float(20.5)) * 0.02 + (0.4 if is_state(''input_boolean.entrance_heater_power'',
        ''on'') else 0) - 0, 5] | max, 40] | min) | round(1) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.entrance_co2_sim
    data:
      value: '{{ [[states(''input_number.entrance_co2_sim'') | float(450) + 15 - (90 if is_state(''input_boolean.entrance_ventilation_power'', ''on'') else 0), 400] | max, 5000] | min }}'
  - action: input_number.set_value
