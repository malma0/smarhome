    turn_on:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.entrance_light_power
    turn_off:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.entrance_light_power
    set_level:
    - action: input_number.set_value
      target:
        entity_id: input_number.entrance_light_brightness
