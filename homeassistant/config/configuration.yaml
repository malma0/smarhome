- id: window_pauses_climate
  alias: 'Окно открыто: отопление и кондиционер на паузе, закрыто - как было'
  mode: parallel
  triggers:
  - trigger: state
    entity_id: &id001
    - binary_sensor.bedroom_window
    - binary_sensor.office_window
    - binary_sensor.living_room_window
    - binary_sensor.kitchen_window
    from: 'off'
    to: 'on'
  - trigger: state
    entity_id: *id001
    from: 'on'
    to: 'off'
  variables: &id002
    slug: '{{ trigger.entity_id.split(''.'')[1].rsplit(''_'', 1)[0] }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      sequence:
      - action: scene.create
        data:
          scene_id: window_{{ slug }}
          snapshot_entities:
          - climate.{{ slug }}_heating
          - climate.{{ slug }}_ac
      - action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.{{ slug }}_heating
          - climate.{{ slug }}_ac
        data:
          hvac_mode: 'off'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ expand(''scene.window_'' ~ slug) | count > 0 }}'
        sequence:
        - action: scene.turn_on
          target:
            entity_id: scene.window_{{ slug }}
      default:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.{{ slug }}_heating
        data:
          hvac_mode: heat
- id: night_light_on_motion
  alias: 'Ночью по движению: свет на 30%'
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.corridor_motion
    - binary_sensor.entrance_motion
    to: 'on'
  conditions:
  - condition: time
    after: '23:00:00'
    before: 07:00:00
  - condition: state
    entity_id: input_boolean.security_armed
    state: 'off'
  variables: *id002
  actions:
  - condition: template
    value_template: '{{ is_state(''light.'' ~ slug, ''off'') }}'
  - action: light.turn_on
    target:
      entity_id: light.{{ slug }}
    data:
      brightness_pct: 30
  - wait_template: '{{ is_state(''binary_sensor.'' ~ slug ~ ''_motion'', ''off'') }}'
  - delay: 00:02:00
  - condition: template
    value_template: '{{ is_state(''binary_sensor.'' ~ slug ~ ''_motion'', ''off'') }}'
  - action: light.turn_off
    target:
      entity_id: light.{{ slug }}
- id: empty_room_light_off
  alias: 'Пустая комната: свет гаснет через 10 минут без движения'
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.entrance_motion
    - binary_sensor.bedroom_motion
    - binary_sensor.office_motion
    - binary_sensor.living_room_motion
    - binary_sensor.corridor_motion
    - binary_sensor.kitchen_motion
    to: 'off'
    for:
      minutes: 10
  variables: *id002
  actions:
  - action: light.turn_off
    target:
      entity_id: light.{{ slug }}
- id: security_intrusion
  alias: 'Охрана: движение или открытие в пустом доме'
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.entrance_motion
    - binary_sensor.bedroom_motion
    - binary_sensor.office_motion
    - binary_sensor.living_room_motion
    - binary_sensor.corridor_motion
    - binary_sensor.kitchen_motion
    - binary_sensor.bedroom_window
    - binary_sensor.office_window
    - binary_sensor.living_room_window
    - binary_sensor.kitchen_window
    - binary_sensor.entrance_door
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.security_armed
    state: 'on'
  variables: *id002
  actions:
  - delay: 00:01:00
  - condition: state
    entity_id: input_boolean.security_armed
    state: 'on'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.{{ slug }}_intrusion_flag
