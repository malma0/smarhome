<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="panel.css">
<title>Jarvis</title>
</head>
<body>

<div id="lock" class="lock" hidden>
  <div class="lock-box">
    <div class="brand">J A R V I S</div>
    <p class="muted">Введи PIN панели (APP_PIN в настройках Джарвиса)</p>
    <form id="lockForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
      <button type="submit" class="primary">Войти</button>
    </form>
    <p id="lockError" class="error"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">J A R V I S</div>
    <div id="status" class="muted">…</div>
  </header>

  <main>
    <section id="tab-house" class="tab">
      <div id="houseCard"></div>
      <div id="rooms" class="rooms"></div>
    </section>
    <section id="tab-scenes" class="tab" hidden>
      <h2>Сценарии</h2>
      <div id="scenes" class="buttons"></div>
      <h2>Расписания</h2>
      <div id="schedules"></div>
    </section>
    <section id="tab-chat" class="tab" hidden>
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" autocomplete="off" placeholder="Написать Джарвису…">
        <button type="submit" class="primary">➤</button>
      </form>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="house" class="active">Дом</button>
    <button data-tab="scenes">Сценарии</button>
    <button data-tab="chat">Чат</button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>
<script src="panel.js"></script>
</body>
</html>
